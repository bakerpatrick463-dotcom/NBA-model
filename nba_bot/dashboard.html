<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA Paper Research</title><style>
body{font:16px system-ui;background:#111827;color:#e5e7eb;margin:auto;max-width:1100px;padding:32px}h1{font-size:30px}button,select{padding:10px;background:#25344e;color:white;border:1px solid #6b7280;border-radius:6px}.banner{padding:18px;background:#422f16;color:#ffda8c;border-radius:10px;margin:20px 0}.cards{display:flex;gap:14px;flex-wrap:wrap}.card{padding:18px;background:#1f2937;border-radius:10px;min-width:110px}.value{font-size:26px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #374151}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#adb7c9}.scroll{overflow-x:auto}
</style><h1>NBA Paper Research</h1><p>Research ledger · Paper execution only · No real-money integration</p>
<label>Data mode <select id="mode"><option value="live">Live</option><option value="mock">Simulated demo</option></select></label> <button id="refresh">Refresh</button>
<div class="banner" id="status">Loading…</div><div class="cards" id="cards"></div><h2>Selections</h2><div class="scroll"><table><thead><tr><th>Market</th><th>Book / price</th><th>Probability / EV</th><th>Status</th><th>Net units</th></tr></thead><tbody id="bets"></tbody></table></div>
<h2>Data freshness and limitations</h2><pre id="freshness"></pre><details><summary>Breakdowns, calibration and drawdown</summary><pre id="details"></pre></details><details><summary>Selection evidence and audit identifiers</summary><pre id="audit"></pre></details>
<script>
const el=id=>document.getElementById(id), fmt=x=>x===null?'—':Number(x).toFixed(2);
function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td)}
async function refresh(){try{const response=await fetch('/api/dashboard?mode='+el('mode').value);if(!response.ok)throw Error('Dashboard request failed');const d=await response.json();el('status').textContent=d.mode+' · 14-day live trial has NOT started. A 65% win rate is a target, not a promise.';el('cards').replaceChildren();for(const [k,v]of Object.entries(d.summary)){const c=document.createElement('div');c.className='card';const label=document.createElement('small');label.textContent=k.replaceAll('_',' ');const value=document.createElement('div');value.className='value';value.textContent=fmt(v);c.append(label,value);el('cards').append(c)}el('bets').replaceChildren();for(const b of d.bets){const r=document.createElement('tr');cell(r,b.quote.subject+' '+b.quote.market+' '+b.quote.side+' '+b.quote.line);cell(r,b.quote.book+' / '+fmt(b.quote.odds));cell(r,fmt(b.win_probability*100)+'% / '+fmt(b.ev*100)+'%');cell(r,b.status);cell(r,fmt(b.net));el('bets').append(r)}el('freshness').textContent=JSON.stringify({last_collection:d.last_collection,age_seconds:d.freshness_seconds,limitations:d.limitations,operations:d.recent_operations},null,2);el('details').textContent=JSON.stringify({breakdowns:d.breakdowns,calibration:d.calibration,max_drawdown_units:d.max_drawdown_units},null,2);el('audit').textContent=JSON.stringify(d.bets,null,2)}catch(e){el('status').textContent='Data unavailable: '+e.message}}
el('refresh').onclick=refresh;el('mode').onchange=refresh;refresh();setInterval(refresh,30000);
</script></html>
