services:
  worker:
    build: .
    command: ["python3", "-m", "nba_bot", "worker"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    volumes: ["paper-data:/app/var"]
    healthcheck:
      test: ["CMD", "python3", "-c", "from nba_bot.store import Store; from nba_bot.core import now,dt; s=Store('var/paper.sqlite'); r=s.db.execute('SELECT recorded,ok FROM operations WHERE mode=\"mock\" ORDER BY seq DESC LIMIT 1').fetchone(); assert r and r['ok'] and (now()-dt(r['recorded'])).total_seconds()<2700; s.close()"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
  dashboard:
    build: .
    command: ["python3", "-m", "nba_bot", "serve", "--host", "0.0.0.0"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    volumes: ["paper-data:/app/var"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [worker]
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health?mode=mock',timeout=5).read()"]
      interval: 60s
      timeout: 10s
      retries: 3
volumes:
  paper-data:
